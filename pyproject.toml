# For `uv tool install`, which puts a `dtumcp` command on PATH. server.py
# keeps its own inline metadata too, for `uv run --script server.py`; the
# dependencies must match, which test_server.py checks.
[project]
name = "dtumcp"
version = "0.1.0"
description = "MCP server for DTU Learn (D2L Brightspace) course material"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=2", "httpx", "websockets>=12"]

[project.scripts]
dtumcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py"]
