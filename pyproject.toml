# For `uv tool install`, which puts a `dtumcp` command on PATH, and for
# `uv run dtumcp` in a clone. The code is the package in src/dtumcp.
[project]
name = "dtumcp"
version = "0.1.0"
description = "MCP server for DTU Learn (D2L Brightspace) course material"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=2", "httpx", "websockets>=12"]

[project.scripts]
dtumcp = "dtumcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
